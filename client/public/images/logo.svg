<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Awon Pharmacy logo">
  <defs>
    <linearGradient id="awonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.5" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="awonGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="0" y="0" width="200" height="200" rx="48" fill="url(#awonGrad)"/>

  <!-- Top sheen highlight -->
  <ellipse cx="100" cy="28" rx="70" ry="15" fill="#ffffff" opacity="0.14"/>

  <!-- Inner ring -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2.5"/>

  <!-- Mortar (bowl) -->
  <path d="M62 118
           L138 118
           C150 118 156 126 156 136
           L156 142
           C156 153 146 158 132 158
           L68 158
           C54 158 44 153 44 142
           L44 136
           C44 126 50 118 62 118 Z"
        fill="#ffffff"/>

  <!-- Pestle -->
  <g transform="rotate(-16 100 90)">
    <rect x="92" y="38" width="16" height="82" rx="8" fill="#ffffff"/>
    <ellipse cx="100" cy="122" rx="11" ry="9" fill="#ffffff"/>
  </g>

  <!-- Medical plus accent -->
  <g stroke="#a5f3fc" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M148 44 v20"/>
    <path d="M138 54 h20"/>
  </g>

  <!-- Star accent -->
  <path d="M166 128 L169.2 136.4 L178 136.9 L171.2 142.4 L173.4 151 L166 146.6 L158.6 151 L160.8 142.4 L154 136.9 L162.8 136.4 Z" fill="url(#awonGold)"/>
</svg>
