<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d9488" />
    <title>You are offline — Awon Pharmacy</title>
    <style>
      body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #f8fafc; color: #0f172a; display: flex; min-height: 100vh; align-items: center; justify-content: center; text-align: center; padding: 24px; }
      .card { max-width: 420px; }
      .logo { width: 72px; height: 72px; border-radius: 18px; background: #0d9488; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 40px; font-weight: 800; }
      h1 { font-size: 24px; margin: 0 0 8px; }
      p { color: #64748b; line-height: 1.6; margin: 0 0 24px; }
      button { background: #0d9488; color: #fff; border: 0; border-radius: 10px; padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer; }
      button:hover { background: #0f766e; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">A</div>
      <h1>You are offline</h1>
      <p>Check your internet connection and try again. Your saved products will be here when you are back online.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
